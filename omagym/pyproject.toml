[project]
name = "omagym"
version = "0.1.0"
description = "A lab for training agents to play omagames, and comparing them"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
omagym = "omagym.cli:main"

# PyTorch is only for the agents that learn with a neural network. It is a
# group installed by default, so `uv run` brings it in; CI and quick checks
# can leave it out with `--no-group learn`.
[dependency-groups]
learn = ["torch>=2.4"]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["learn", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omagym"]

[tool.pytest.ini_options]
testpaths = ["tests"]

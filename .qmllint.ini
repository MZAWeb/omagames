# qmllint configuration for Omagames. See `bin/../.github/workflows/ci.yml`
# (the "QML lint" step) for how CI runs it: every warning fails the job, so a
# category is only disabled here when it cannot be satisfied, with the reason.

[General]
DisableDefaultImports=false
MaxWarnings=-1

[Warnings]
# Every game exposes its engine to QML as the C++ context properties `theme`
# (OmarchyTheme) and `game` (the <Game>Game bridge) — see docs/ARCHITECTURE.md.
# Context properties are injected at runtime by QQmlContext::setContextProperty
# and are invisible to static analysis, so qmllint reports every single use of
# `theme.*` / `game.*` as an unqualified access. That is the architecture, not a
# defect, and qmllint has no way to whitelist individual identifiers, so the
# whole category has to go. All other categories stay at their defaults.
UnqualifiedAccess=disable

# Promoted from `info`: an import no file uses is dead code (CLAUDE.md).
UnusedImports=warning
